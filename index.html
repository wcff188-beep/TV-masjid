<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Masjid - Smart Signage System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #000; }
        
        .marquee-container { background-color: #1a202c; color: white; padding: 8px 0; overflow: hidden; white-space: nowrap; position: relative; z-index: 20;}
        .marquee-content { display: inline-block; padding-left: 100%; animation: marquee 30s linear infinite; font-size: 1.1rem; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        .active-prayer { box-shadow: 0 -4px 15px rgba(255, 255, 255, 0.8); z-index: 10; transform: scale(1.02); transition: all 0.3s ease; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-full flex flex-col">

    <!-- LAYAR GELAP SAAT SHOLAT (Blackout Mode) -->
    <div id="blackout-screen" class="hidden fixed inset-0 bg-black z-[200] flex flex-col items-center justify-center">
        <h1 class="text-6xl text-gray-500 font-bold mb-6">MOHON LURUSKAN SHAF</h1>
        <h2 class="text-4xl text-gray-600 mb-8">Sholat Sedang Berlangsung</h2>
        <i class="fas fa-mobile-alt text-8xl text-red-900 mb-4 animate-bounce"></i>
        <p class="text-2xl text-red-800 font-bold">Harap Nonaktifkan HP Anda</p>
    </div>

    <!-- LAYER BACKGROUND -->
    <div id="bg-container" class="absolute inset-0 overflow-hidden z-0 bg-gray-900">
        <div id="bg-image" class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-all duration-1000"></div>
        <video id="bg-video" class="absolute inset-0 w-full h-full object-cover hidden" autoplay loop muted playsinline></video>
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
    </div>

    <!-- HEADER -->
    <header class="relative z-10 bg-white/95 backdrop-blur shadow-md flex items-center justify-between px-8 py-3 border-b-2 border-gray-300">
        <div class="flex-shrink-0 w-48">
            <h1 id="jam-digital" class="text-6xl font-extrabold text-gray-800 tracking-tight">00:00</h1>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center border-l-4 border-r-4 border-orange-400 px-4">
            <h2 id="display-nama" class="text-3xl font-extrabold text-gray-900 tracking-wide">Masjid Darussalam Al-Amin</h2>
            <p id="display-alamat" class="text-gray-600 font-medium text-lg mt-1">Kel.Kalibaru, Kec.Cilincing, Jakarta Utara</p>
        </div>
        <div class="flex-shrink-0 w-56 text-right">
            <p id="tgl-masehi" class="text-xl font-bold text-gray-800">Memuat...</p>
            <p id="tgl-hijri" class="text-gray-500 font-semibold mt-1">Memuat...</p>
        </div>
    </header>

    <!-- AREA TENGAH -->
    <main class="flex-1 relative z-10 flex flex-col justify-end pb-2">
        <button onclick="toggleModal()" class="absolute right-0 top-1/2 transform -translate-y-1/2 bg-white/80 hover:bg-white p-3 rounded-l-lg shadow-lg text-gray-700 transition">
            <i class="fas fa-cog text-2xl"></i>
        </button>
        <div class="px-6 flex justify-between items-end mb-2 drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">
            <div id="next-prayer-info" class="bg-white/95 text-black px-4 py-1.5 rounded font-bold text-xl shadow-lg border-l-4 border-orange-500">
                Memuat Waktu...
            </div>
            <div id="event-countdown" class="bg-white/95 text-black px-4 py-1.5 rounded font-bold text-xl shadow-lg border-r-4 border-green-600">
                Memuat Acara...
            </div>
        </div>
    </main>

    <!-- JADWAL SHOLAT -->
    <div class="relative z-20 bg-white grid grid-cols-7 border-t-2 border-gray-300 shadow-[0_-10px_20px_rgba(0,0,0,0.3)]" id="prayer-schedule"></div>

    <!-- RUNNING TEXT -->
    <div class="marquee-container border-t-2 border-gray-700">
        <div class="marquee-content" id="display-marquee">Memuat informasi...</div>
    </div>

    <!-- MODAL MENU PENGATURAN -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-[700px] max-h-[95vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="bg-gray-100 p-4 border-b flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-tools mr-2 text-blue-600"></i> Pengaturan Sistem Masjid</h2>
                <button onclick="toggleModal()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times text-2xl"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-4 flex-1">
                <!-- Info Masjid -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-1">Nama Masjid</label>
                        <input type="text" id="input-nama" class="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-1">Alamat Singkat</label>
                        <input type="text" id="input-alamat" class="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                </div>

                <!-- Sistem Smart Timer -->
                <div class="bg-orange-50 border border-orange-200 rounded-lg p-4 grid grid-cols-2 gap-4">
                    <div class="col-span-2 text-sm font-bold text-orange-800 mb-2 border-b border-orange-200 pb-2"><i class="fas fa-stopwatch mr-1"></i> Pengaturan Timer (Iqomah & Layar Gelap)</div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Waktu Tunggu Iqomah (Menit)</label>
                        <input type="number" id="input-iqomah" class="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:border-blue-500 font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Lama Layar Padam/Gelap (Menit)</label>
                        <input type="number" id="input-blackout" class="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:border-blue-500 font-bold">
                    </div>
                </div>

                <!-- Background -->
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                    <div class="grid grid-cols-3 gap-3 mb-2">
                        <div class="col-span-1">
                            <label class="block text-sm font-bold text-blue-900 mb-1">Tipe Latar</label>
                            <select id="input-bg-type" class="w-full border border-blue-300 rounded px-3 py-2 outline-none focus:border-blue-500 font-bold text-sm">
                                <option value="image">Gambar (Foto)</option>
                                <option value="video">Video (MP4)</option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-bold text-blue-900 mb-1">Direct Link (URL Langsung)</label>
                            <input type="text" id="input-bg" class="w-full border border-blue-300 rounded px-3 py-2 outline-none focus:
